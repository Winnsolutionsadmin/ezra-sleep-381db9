<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>sleep check — ezra</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--card:#161f38;--line:#26314f;--fg:#eef1f8;--dim:#9aa6c4;--accent:#f4c56a;--sel:#2a3a66}
*{box-sizing:border-box;min-width:0}html,body{overflow-x:hidden;max-width:100%}
body{margin:0;background:radial-gradient(900px 500px at 30% -10%,#1b2650 0%,var(--bg) 60%);color:var(--fg);font:17px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:26px 18px 60px}
.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600}
h1{font-size:26px;margin:8px 0 6px;line-height:1.2}p.sub{color:var(--dim);margin:0 0 18px;font-size:15px}
.bar{height:4px;background:var(--line);border-radius:4px;margin:8px 0 22px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.q{font-size:21px;font-weight:600;line-height:1.3;margin:0 0 14px}
.reply{background:#0f1730;border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;color:var(--fg);margin:0 0 14px;font-size:16px}
.opts{display:grid;gap:8px}
button.opt{text-align:left;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;cursor:pointer}
button.opt.on{background:var(--sel);border-color:#5f78c0}
textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px;font:inherit;min-height:90px}
.row{display:flex;gap:10px;margin-top:16px}
button.go{flex:1;background:var(--accent);color:#1a1300;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
button.back{background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:inherit;cursor:pointer}
.code{background:var(--card);border:1px dashed #5f78c0;border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;margin:14px 0}
.hide{display:none}
</style></head><body><div class="wrap">
<div class="eyebrow">ezra · sleep check</div>
<div id="intro">
<h1>a few questions about your sleep. no wrong answers.</h1>
<p class="sub">takes about 4 minutes. it's not a test and nobody's grading it. straight answers get you a better plan. you can skip anything.</p>
<button class="go" onclick="start()">start</button>
</div>
<div id="stage" class="hide">
<div class="bar"><i id="bar"></i></div>
<div id="reply" class="reply hide"></div>
<div id="q" class="q"></div>
<div id="opts" class="opts"></div>
<div class="row"><button class="back" onclick="back()">back</button><button class="go" id="next" onclick="next()">next</button></div>
</div>
<div id="done" class="hide">
<h1>done.</h1>
<p class="sub" id="closing"></p>
<div class="code" id="code"></div>
<div class="row"><button class="go" onclick="copyCode()">copy the code</button></div>
<p class="sub" id="copied"></p>
</div>
</div>
<script>
const SPEC={"version": 1, "closing": "that's it. thanks for doing that for real. text the code below to arya, or just show it to your dad. nothing here gets decided without you.", "questions": [{"id": "q1", "text": "school nights. what time do you usually actually try to sleep, lights out, phone down?", "type": "single", "options": ["before 10", "10 to 11", "11 to 12", "12 to 1", "after 1"]}, {"id": "q2", "text": "once you're actually trying, how long till you're out?", "type": "single", "reply": {"under 15 min": "so falling asleep isn't the problem. that narrows it a lot.", "15 to 30": "that's normal range. ok.", "30 to 60": "so it's a falling-asleep thing. a few on that.", "1 to 2 hours": "yeah that's rough. it's a falling-asleep thing, not a staying-asleep thing. a few on that.", "2 hours plus": "that's a lot of lying there. it's a falling-asleep thing for sure. a few on that."}, "options": ["under 15 min", "15 to 30", "30 to 60", "1 to 2 hours", "2 hours plus"]}, {"id": "q3", "text": "school days, what time do you get up?", "type": "single", "options": ["before 6", "6 to 6:30", "6:30 to 7", "7 to 7:30", "after 7:30"]}, {"id": "q4", "text": "and how does waking up go?", "type": "single", "options": ["alarm, and i'm up", "alarm plus a few snoozes", "someone has to drag me up", "i wake before the alarm"]}, {"id": "q5", "text": "weekend or vacation, nothing to get up for. when do you actually fall asleep?", "type": "single", "options": ["before 11", "11 to 12", "12 to 1", "1 to 2", "2 to 3", "after 3"]}, {"id": "q6", "text": "and when do you wake up on your own those days?", "type": "single", "options": ["before 8", "8 to 9", "9 to 10", "10 to 11", "11 to 12", "after 12"]}, {"id": "q7", "text": "on those free days, how's the sleep itself?", "type": "single", "reply": {"great, i feel rested": "interesting. so when the schedule's yours, it works. that's a real clue.", "ok": "ok.", "still bad": "so it's bad even on your own schedule. noted, that changes things."}, "options": ["great, i feel rested", "ok", "still bad"]}, {"id": "q8", "text": "if you go to bed earlier than usual on purpose, like 10, what happens?", "type": "single", "reply": {"i fall asleep fine": "so the sleep is there when you give it the time. big clue.", "i just lie there, not sleepy at all": "not tired, just awake. that's a body-clock thing, not a you thing.", "tired but my brain won't shut off": "tired but wired. that's its own thing and it's fixable.", "never really tried": "fair. we might test that at some point."}, "options": ["i fall asleep fine", "i just lie there, not sleepy at all", "tired but my brain won't shut off", "never really tried"]}, {"id": "q9", "text": "the last hour before you try to sleep, what are you mostly doing?", "type": "multi", "options": ["phone / social", "gaming", "homework", "tv or youtube", "reading", "music", "nothing much"]}, {"id": "q10", "text": "after you've decided to sleep, does the phone come back out?", "type": "single", "reply": {"it's how i fall asleep": "no judgment. a lot of people do that. it's just useful to know."}, "options": ["never", "sometimes", "most nights", "it's how i fall asleep"]}, {"id": "q11", "text": "when you're lying there awake, what's it like?", "type": "single", "skip_if": {"q2": ["under 15 min"]}, "options": ["not sleepy at all, just awake", "tired but thoughts racing", "worried or stressed about stuff", "bored, waiting", "i'm not really lying there awake"]}, {"id": "q12", "text": "do you wake up during the night?", "type": "single", "options": ["no", "once, back to sleep fast", "a few times", "a lot, and hard to get back to sleep"]}, {"id": "q13", "text": "what wakes you?", "type": "multi", "show_if": {"q12": ["a few times", "a lot, and hard to get back to sleep"]}, "options": ["don't know", "bathroom", "noise", "too hot or cold", "phone or notifications", "bad dreams", "can't breathe / gasping"]}, {"id": "q14", "text": "has anyone ever said you snore, or that you stop breathing or gasp in your sleep?", "type": "single", "reply": {"gasp or stop breathing": "ok. that one actually matters, thanks for being straight about it.", "snore a lot": "noted, that's useful."}, "options": ["no", "snore sometimes", "snore a lot", "gasp or stop breathing"]}, {"id": "q15", "text": "first thing in the morning, how do you feel? pick all that fit", "type": "multi", "options": ["fine", "groggy for an hour or more", "headache", "dry mouth or sore throat", "like i didn't sleep at all"]}, {"id": "q16", "text": "during the day, do you fall asleep or almost fall asleep when you don't mean to? class, car, watching something", "type": "single", "options": ["never", "rarely", "most days", "every day"]}, {"id": "q17", "text": "naps after school?", "type": "single", "options": ["no", "sometimes, short", "most days", "long ones, an hour plus"]}, {"id": "q18", "text": "in the evening or in bed, do your legs ever get an uncomfortable urge to move that gets better when you move them?", "type": "single", "options": ["never", "sometimes", "most nights"]}, {"id": "q19", "text": "caffeine on a normal day. pick all that apply", "type": "multi", "options": ["none", "morning coffee or tea", "soda in the afternoon", "energy drink (monster, celsius, red bull)", "pre-workout", "anything after 6pm"]}, {"id": "q20", "text": "roughly when's your last caffeine?", "type": "single", "show_if_not": {"q19": ["none"]}, "reply": {"after 8": "yeah. that alone could be a chunk of it.", "5 to 8": "that's late enough to matter. good to know."}, "options": ["before noon", "12 to 2", "2 to 5", "5 to 8", "after 8"]}, {"id": "q21", "text": "vape or nicotine? straight answer, this goes in a category, not a lecture", "type": "single", "options": ["no", "sometimes", "daily"]}, {"id": "q22", "text": "when do you usually do your tonal workouts?", "type": "single", "options": ["morning", "afternoon", "evening, before dinner", "after 8pm", "varies"]}, {"id": "q23", "text": "anything you take regularly? pick all", "type": "multi", "options": ["ashwagandha in the morning", "ashwagandha at night", "melatonin", "magnesium", "nothing", "something else"]}, {"id": "q24", "text": "your room at night. pick all", "type": "multi", "options": ["pretty dark", "light from a screen or lamp", "streetlight or hallway light", "noisy", "hot", "fine honestly"]}, {"id": "q25", "text": "last two weeks, how often has stress or worry been on your mind at night?", "type": "single", "options": ["not at all", "a few days", "more than half the days", "nearly every day"]}, {"id": "q26", "text": "last two weeks, how often have you not felt like doing stuff you'd normally be into?", "type": "single", "options": ["not at all", "a few days", "more than half the days", "nearly every day"]}, {"id": "q27", "text": "school and homework load lately?", "type": "single", "options": ["fine", "heavy some nights", "heavy most nights", "crushing"]}, {"id": "q30", "text": "bad dreams or waking up scared?", "type": "single", "options": ["rarely", "sometimes", "often"]}, {"id": "q28", "text": "last one. what do YOU actually want out of this?", "type": "multi", "options": ["fall asleep faster", "sleep longer", "wake up less", "not feel wrecked in the morning", "honestly i'm fine"]}, {"id": "q29", "text": "anything you've already tried, and did it do anything? (optional, a few words)", "type": "text", "options": []}]};
const Q=SPEC.questions; let A={}; let hist=[]; let i=-1; let pendingReply="";
function visible(q){
  if(q.show_if){for(const k in q.show_if){const v=A[k]; const vs=Array.isArray(v)?v:[v]; if(!q.show_if[k].some(x=>vs.includes(x))) return false;}}
  if(q.show_if_not){for(const k in q.show_if_not){const v=A[k]; const vs=Array.isArray(v)?v:(v==null?[]:[v]); if(vs.length===0||q.show_if_not[k].every(x=>vs.includes(x))) return false;}}
  if(q.skip_if){for(const k in q.skip_if){const v=A[k]; const vs=Array.isArray(v)?v:[v]; if(q.skip_if[k].some(x=>vs.includes(x))) return false;}}
  return true;
}
function start(){document.getElementById('intro').classList.add('hide');document.getElementById('stage').classList.remove('hide');i=-1;advance();}
function advance(){ do{i++;}while(i<Q.length&&!visible(Q[i])); if(i>=Q.length) return finish(); render(); }
function render(){
  const q=Q[i]; document.getElementById('bar').style.width=Math.round(100*i/Q.length)+'%';
  const r=document.getElementById('reply'); if(pendingReply){r.textContent=pendingReply;r.classList.remove('hide');}else r.classList.add('hide'); pendingReply="";
  document.getElementById('q').textContent=q.text; const o=document.getElementById('opts'); o.innerHTML='';
  if(q.type==='text'){const t=document.createElement('textarea');t.id='txt';t.value=A[q.id]||'';o.appendChild(t);}
  else q.options.forEach(lab=>{const b=document.createElement('button');b.className='opt';b.textContent=lab;
    const cur=A[q.id]; if(cur&&(Array.isArray(cur)?cur.includes(lab):cur===lab)) b.classList.add('on');
    b.onclick=()=>{ if(q.type==='multi'){ let s=new Set(Array.isArray(A[q.id])?A[q.id]:[]); if(lab==='none'||lab==='nothing'||lab==='fine honestly'||lab==='nothing much'||lab==="honestly i'm fine") s=new Set([lab]); else { for(const x of ['none','nothing','fine honestly','nothing much',"honestly i'm fine"]) s.delete(x); s.has(lab)?s.delete(lab):s.add(lab); } A[q.id]=[...s]; render(); }
      else { A[q.id]=lab; pendingReply=(q.reply&&q.reply[lab])||""; hist.push(i); advance(); } };
    o.appendChild(b);});
  document.getElementById('next').textContent = (q.type==='single')?'skip':'next';
}
function next(){ const q=Q[i]; if(q.type==='text'){const v=document.getElementById('txt').value.trim(); if(v) A[q.id]=v.slice(0,300);} hist.push(i); pendingReply=""; advance(); }
function back(){ if(!hist.length) return; i=hist.pop(); pendingReply=""; render(); }
async function finish(){
  document.getElementById('stage').classList.add('hide'); document.getElementById('done').classList.remove('hide');
  document.getElementById('closing').textContent=SPEC.closing;
  const payload=JSON.stringify({v:SPEC.version,ts:new Date().toISOString().slice(0,16),a:A});
  let code;
  try{ const cs=new CompressionStream('deflate'); const w=cs.writable.getWriter(); w.write(new TextEncoder().encode(payload)); w.close();
    const buf=await new Response(cs.readable).arrayBuffer(); code='EZ1.'+b64u(new Uint8Array(buf)); }
  catch(e){ code='EZ1R.'+b64u(new TextEncoder().encode(payload)); }
  document.getElementById('code').textContent=code; window._code=code;
}
function b64u(u8){ let s=''; u8.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function copyCode(){ navigator.clipboard.writeText(window._code).then(()=>{document.getElementById('copied').textContent='copied. text it to arya or show your dad.';},()=>{document.getElementById('copied').textContent='long-press the code to copy it.';}); }
</script></body></html>
